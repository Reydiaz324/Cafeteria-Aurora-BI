<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación Power BI - Cafetería Aurora</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-enter {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 font-sans antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- BARRA DE PROGRESO SUPERIOR -->
  <header class="w-full bg-stone-950 border-b border-stone-800 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-amber-600 flex items-center justify-center font-bold text-white shadow-md">
        ☕
      </div>
      <div>
        <h1 class="text-sm font-semibold text-stone-100 leading-tight">Cafetería Aurora — Solución de BI</h1>
        <p class="text-xs text-amber-400 font-medium">Power BI & Modelo Dimensional (Sin Big Data)</p>
      </div>
    </div>

    <!-- Indicador de Diapositiva y Botones de Modo -->
    <div class="flex items-center space-x-3">
      <button id="btnGuion" onclick="toggleGuion()" class="px-3 py-1.5 text-xs font-medium rounded-md bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 transition flex items-center space-x-1.5">
        <span>🎙️</span>
        <span>Guión del Expositor</span>
      </button>
      <div class="bg-stone-800 text-stone-300 px-3 py-1 rounded-md text-xs font-mono font-semibold border border-stone-700">
        <span id="currentSlideNum">1</span> / <span id="totalSlidesNum">10</span>
      </div>
    </div>
  </header>

  <!-- LÍNEA DE PROGRESO -->
  <div class="w-full bg-stone-800 h-1">
    <div id="progressBar" class="bg-amber-500 h-1 transition-all duration-300" style="width: 10%;"></div>
  </div>

  <!-- CONTENEDOR PRINCIPAL DEL SLIDE -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-8 flex flex-col justify-center">
    <div id="slideContent" class="slide-enter w-full bg-stone-950/80 border border-stone-800 rounded-2xl p-8 md:p-10 shadow-2xl backdrop-blur-sm min-h-[520px] flex flex-col justify-between">
      <!-- Inyectado dinámicamente vía JavaScript -->
    </div>

    <!-- CAJÓN DE GUIÓN DEL EXPOSITOR (Expandible) -->

      <div class="flex items-center space-x-2 font-semibold text-amber-400 mb-1">
        <span>🗣️ LO QUE DEBES DECIR EN ESTA DIAPOSITIVA:</span>
      </div>
      <p id="guionText" class="italic text-stone-300 text-sm"></p>
    </div>
  </main>

  <!-- CONTROLES INFERIORES DE NAVEGACIÓN -->
  <footer class="w-full bg-stone-950 border-t border-stone-800 px-6 py-4 flex items-center justify-between">
    <button id="btnPrev" onclick="prevSlide()" class="px-4 py-2 rounded-xl bg-stone-800 hover:bg-stone-700 disabled:opacity-30 disabled:cursor-not-allowed text-stone-200 text-xs font-semibold flex items-center space-x-2 transition border border-stone-700">
      <span>←</span>
      <span>Anterior</span>
    </button>

    <div class="hidden sm:flex items-center space-x-1" id="dotsContainer">
      <!-- Puntos de salto directo creados por JS -->
    </div>

    <button id="btnNext" onclick="nextSlide()" class="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:opacity-30 disabled:cursor-not-allowed text-white text-xs font-semibold flex items-center space-x-2 shadow-lg shadow-amber-900/30 transition">
      <span>Siguiente</span>
      <span>→</span>
    </button>

    let currentSlide = 0;
    let guionVisible = false;

    function renderSlide(index) {
      const slide = slides[index];
      const container = document.getElementById('slideContent');
      
      container.className = "w-full bg-stone-950/80 border border-stone-800 rounded-2xl p-8 md:p-10 shadow-2xl backdrop-blur-sm min-h-[520px] flex flex-col justify-between";
      void container.offsetWidth; // Trigger reflow for animation
      container.className = "slide-enter w-full bg-stone-950/80 border border-stone-800 rounded-2xl p-8 md:p-10 shadow-2xl backdrop-blur-sm min-h-[520px] flex flex-col justify-between";

      container.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-800/80">
            <div>
              <span class="text-xs font-bold text-amber-500 uppercase tracking-wider">Diapositiva ${slide.id} de ${slides.length}</span>
              <h2 class="text-xl md:text-2xl font-extrabold text-white tracking-tight mt-0.5">${slide.title}</h2>
              <p class="text-xs text-stone-400 font-light">${slide.subtitle}</p>
            </div>
            <div class="hidden md:block text-2xl opacity-40">☕</div>
          </div>
          <div class="py-2">
            ${slide.content}
          </div>
        </div>
        <div class="pt-4 border-t border-stone-900 flex justify-between items-center text-[11px] text-stone-500">
          <span>Cafetería Aurora — Solución de Inteligencia de Negocios</span>
          <span>Power BI & Star Schema</span>
        </div>
      `;

      // Actualizar número y barra
      document.getElementById('currentSlideNum').innerText = slide.id;
      document.getElementById('totalSlidesNum').innerText = slides.length;
      document.getElementById('progressBar').style.width = ((slide.id / slides.length) * 100) + '%';
      document.getElementById('guionText').innerText = slide.guion;

      // Actualizar estados de botones
      document.getElementById('btnPrev').disabled = (index === 0);
      document.getElementById('btnNext').disabled = (index === slides.length - 1);

      // Actualizar puntos de navegación
      renderDots();
    }

    function renderDots() {
      const dotsContainer = document.getElementById('dotsContainer');
      dotsContainer.innerHTML = '';
      slides.forEach((s, i) => {
        const dot = document.createElement('button');
        dot.className = `w-2.5 h-2.5 rounded-full transition-all ${i === currentSlide ? 'bg-amber-500 w-6' : 'bg-stone-700 hover:bg-stone-500'}`;
        dot.title = `Ir a diapositiva ${i + 1}`;
        dot.onclick = () => { currentSlide = i; renderSlide(currentSlide); };
        dotsContainer.appendChild(dot);
      });
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function toggleGuion() {
      guionVisible = !guionVisible;
      const box = document.getElementById('guionBox');
      const btn = document.getElementById('btnGuion');
      if (guionVisible) {
        box.classList.remove('hidden');
        btn.classList.add('bg-amber-600', 'text-white');
        btn.classList.remove('bg-stone-800', 'text-stone-300');
      } else {
        box.classList.add('hidden');
        btn.classList.remove('bg-amber-600', 'text-white');
        btn.classList.add('bg-stone-800', 'text-stone-300');
      }
    }

    // Navegación por teclado (Flechas izquierda / derecha)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 'g' || e.key === 'G') {
        toggleGuion();
      }
    });

    // Iniciar en Diapositiva 1
    renderSlide(0);
  </script>
